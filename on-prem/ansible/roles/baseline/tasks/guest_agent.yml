- name: Install the QEMU guest agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Check for the agent's virtio port
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: baseline_guest_agent_port

- name: Start the QEMU guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
  when: baseline_guest_agent_port.stat.exists
