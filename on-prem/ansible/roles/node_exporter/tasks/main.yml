---
- name: Install prometheus-node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start node_exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
