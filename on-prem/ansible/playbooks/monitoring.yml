- name: Install node_exporter
  hosts: all
  become: true

  tasks:
    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start node_exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true


- name: Deploy the Alloy stack
  hosts: monitoring
  become: true

  vars:
    alloy_dir: "{{ stacks_dir }}/alloy"

  handlers:
    - name: Restart alloy
      community.docker.docker_compose_v2:
        project_src: "{{ alloy_dir }}"
        state: restarted

  tasks:
    - name: Create the stack directory
      ansible.builtin.file:
        path: "{{ alloy_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy compose.yml
      ansible.builtin.template:
        src: alloy-compose.yml
        dest: "{{ alloy_dir }}/compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Deploy .env
      ansible.builtin.template:
        src: alloy.env
        dest: "{{ alloy_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      diff: false

    - name: Deploy the Alloy config
      ansible.builtin.template:
        src: config.alloy
        dest: "{{ alloy_dir }}/config.alloy"
        owner: root
        group: root
        mode: "0644"
      notify: Restart alloy

    - name: Start the stack
      community.docker.docker_compose_v2:
        project_src: "{{ alloy_dir }}"
        state: present

- name: Deploy the GPU exporter
  hosts: gpu
  become: true

  vars:
    gpu_exporter_dir: "/opt/nvidia_gpu_exporter/{{ gpu_exporter_version }}"

  handlers:
    - name: Restart gpu exporter
      ansible.builtin.systemd:
        name: nvidia-gpu-exporter
        state: restarted
        daemon_reload: true

  tasks:
    - name: Create the versioned install directory
      ansible.builtin.file:
        path: "{{ gpu_exporter_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download and unpack the exporter
      ansible.builtin.unarchive:
        src: "https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v{{ gpu_exporter_version }}/nvidia_gpu_exporter_{{ gpu_exporter_version }}_linux_x86_64.tar.gz"
        dest: "{{ gpu_exporter_dir }}"
        remote_src: true
        creates: "{{ gpu_exporter_dir }}/nvidia_gpu_exporter"

    - name: Deploy the systemd unit
      ansible.builtin.template:
        src: nvidia-gpu-exporter.service
        dest: /etc/systemd/system/nvidia-gpu-exporter.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart gpu exporter

    - name: Enable and start the exporter
      ansible.builtin.systemd:
        name: nvidia-gpu-exporter
        state: started
        enabled: true
        daemon_reload: true
